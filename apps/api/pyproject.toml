[project]
name = "repopilot-api"
version = "0.1.0"
description = "RepoPilot API: repo-aware AI software engineering agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
# Optional: real semantic retrieval. Pulls torch (CPU) + the MiniLM weights.
# Kept out of the default install so the deterministic path and test suite stay
# lean and offline; enable with REPOPILOT_USE_EMBEDDINGS=true.
embeddings = [
  "sentence-transformers>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
